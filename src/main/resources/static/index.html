<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Remote PC</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; --ink: #f4f0e8; --muted: #a8aaa5; --line: #39464a; --panel: #182126; --accent: #f0b35b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% 0%, #283940 0, #10161a 42%, #0b0e10 100%); color: var(--ink); padding: 22px 16px 30px; }
    main { max-width: 580px; margin: auto; display: grid; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: end; padding: 2px 4px; }
    .eyebrow { color: var(--accent); font: 11px system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 8vw, 42px); line-height: 1; margin: 5px 0 0; }
    #status { color: #8fe0a9; font: 12px system-ui, sans-serif; border: 1px solid #31503d; border-radius: 20px; padding: 7px 10px; }
    .label { color: var(--muted); font: 11px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    #pad { height: min(57vh, 460px); min-height: 280px; background: linear-gradient(145deg, #1f3035, var(--panel)); border: 1px solid var(--line); border-radius: 22px; display: grid; place-items: center; touch-action: none; user-select: none; box-shadow: inset 0 1px #ffffff0d, 0 15px 35px #0005; }
    #pad span { color: #9ba6a4; font: 14px system-ui, sans-serif; text-align: center; line-height: 1.8; }
    #pad span strong { color: var(--ink); font-weight: 600; }
    .buttons, .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button, input { min-height: 50px; border: 1px solid var(--line); border-radius: 12px; background: #1b272c; color: inherit; font: 15px system-ui, sans-serif; }
    button { cursor: pointer; transition: background .15s, transform .15s; }
    button:active { background: #3f5558; transform: translateY(1px); }
    .buttons button:first-child { border-color: #aa7b43; }
    input { width: 100%; padding: 0 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    .type { display: flex; gap: 8px; }
    .type button { padding: 0 19px; white-space: nowrap; background: var(--accent); color: #20180d; border-color: var(--accent); font-weight: 700; }
    .quick button { color: #c7d0cf; font-size: 13px; }
    @media (max-width: 380px) { body { padding-inline: 11px; } #pad { min-height: 250px; } }
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">Local control</div><h1>Remote PC</h1></div><span id="status">Checking...</span></header>
  <section id="pad" aria-label="Touchpad"><span><strong>One finger</strong> &nbsp; move cursor<br><strong>Tap</strong> &nbsp; left click<br><strong>Two fingers</strong> &nbsp; scroll</span></section>
  <div class="label">Mouse buttons</div>
  <div class="buttons"><button data-click="left">Left click</button><button data-click="right">Right click</button></div>
  <div class="label">Keyboard</div>
  <div class="buttons"><button data-click="left">Left click</button><button data-click="right">Right click</button></div>
  <div class="type"><input id="text" placeholder="Type on laptop..."><button id="send">Send</button></div>
  <div class="quick">
    <button data-key="enter">Enter</button><button data-key="backspace">Backspace</button>
    <button data-key="space">Space</button><button data-key="escape">Escape</button>
    <button data-key="volumeup">Volume +</button><button data-key="volumedown">Volume -</button>
    <button data-key="mute">Mute</button><button data-key="playpause">Play / Pause</button>
  </div>
</main>
<script>
  const pad = document.querySelector('#pad');
  const status = document.querySelector('#status');
  const pointers = new Map();
  let start = null;
  let scrollY = null;
  const call = (path, body) => fetch('/api/control/' + path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) })
    .then(response => { if (!response.ok) throw new Error(response.status); status.textContent = 'Connected'; })
    .catch(error => status.textContent = error.message === '503' ? 'Desktop unavailable' : 'Request failed');
  fetch('/api/control/status').then(response => { if (!response.ok) throw new Error(); }).catch(() => status.textContent = 'Desktop unavailable');
  pad.addEventListener('pointerdown', event => {
    pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
    pad.setPointerCapture(event.pointerId);
    if (pointers.size === 1) start = {x: event.clientX, y: event.clientY};
    if (pointers.size === 2) scrollY = midpoint().y;
  });
  pad.addEventListener('pointermove', event => {
    if (!pointers.has(event.pointerId)) return;
    const previous = pointers.get(event.pointerId);
    pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
    if (pointers.size >= 2) {
      const currentY = midpoint().y;
      const delta = currentY - scrollY;
      if (Math.abs(delta) >= 12) { call('scroll', {amount: Math.max(-5, Math.min(5, Math.round(delta / 12)))}); scrollY = currentY; }
      return;
    }
    call('move', {dx: Math.round((event.clientX - previous.x) * 1.7), dy: Math.round((event.clientY - previous.y) * 1.7)});
  });
  pad.addEventListener('pointerup', event => {
    const wasSingleTap = pointers.size === 1 && start && Math.abs(event.clientX - start.x) < 8 && Math.abs(event.clientY - start.y) < 8;
    pointers.delete(event.pointerId);
    if (wasSingleTap) call('click', {button: 'left'});
    if (pointers.size === 0) { start = null; scrollY = null; }
  });
  pad.addEventListener('pointercancel', event => { pointers.delete(event.pointerId); start = null; scrollY = null; });
  pad.addEventListener('wheel', event => { event.preventDefault(); call('scroll', {amount: Math.sign(event.deltaY)}); }, {passive: false});
  function midpoint() { const points = [...pointers.values()]; return {x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2}; }
  document.querySelectorAll('[data-click]').forEach(button => button.onclick = () => call('click', {button: button.dataset.click}));
  document.querySelectorAll('[data-key]').forEach(button => button.onclick = () => call('key', {key: button.dataset.key}));
  document.querySelector('#send').onclick = () => { const input = document.querySelector('#text'); if (input.value) { call('type', {text: input.value}); input.value = ''; } };
</script>
</body>
</html>
